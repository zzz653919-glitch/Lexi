<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Lexi — Vocabulary Trainer</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('lexi.theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>

    <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  </svg>

  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" aria-label="Primary" data-i18n-aria="nav.primary">
      <a class="brand" href="#/dashboard" aria-label="Lexi home">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span class="brand-name">Lexi</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="nav.dashboard">Dashboard</span></a>
        <a href="#/vocabulary" data-route="vocabulary"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="nav.vocabulary">My Vocabulary</span></a>
        <a href="#/practice" data-route="practice"><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg><span data-i18n="nav.practice">Practice</span></a>
        <a href="#/difficult" data-route="difficult"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="nav.difficult">Difficult Words</span><b class="nav-badge" id="difficult-badge" hidden>0</b></a>
        <a href="#/progress" data-route="progress"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span data-i18n="nav.progress">Progress</span></a>
        <a href="#/settings" data-route="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span data-i18n="nav.settings">Settings</span></a>
      </nav>
      <div class="lang-switch">
        <label class="sr-only" for="lang-select" data-i18n="lang.label">Language</label>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="uz">O'zbekcha</option>
          <option value="ru">Русский</option>
        </select>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <span class="theme-toggle-label">Dark mode</span>
      </button>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/locales.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/import-export.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/vocabulary.js"></script>
  <script src="js/views/practice.js"></script>
  <script src="js/views/difficult.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
